name: SBOM security
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      refresh:
        description: Regenerate and commit the SBOM before scanning (disable to test the weekly scan)
        type: boolean
        default: true
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: write
  issues: write
concurrency:
  group: sbom-security
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
      - name: Test scan and issue lifecycle
        run: python3 -m unittest discover -s tests/sbom -p 'test_*.py'
      - name: Refresh SBOM
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: |
          sh build/generate-sbom.sh
          if ! git diff --quiet -- sbom.cdx.json; then
            git config user.name 'Rello'
            git config user.email 'github@scherello.de'
            git add sbom.cdx.json
            git commit -m 'Refresh bundled dependency SBOM' -m 'Signed-off-by: Rello <github@scherello.de>' -m 'Assisted-by: Codex:GPT-5'
            git push origin HEAD:master
          fi
      - name: Scan OSV and reconcile issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create sbom-security --color B60205 --description 'Known dependency vulnerabilities found by the SBOM scan' --force
          python3 build/scan-sbom.py --issues
      - name: Upload SBOM and scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-security-${{ github.run_id }}
          path: |
            sbom.cdx.json
            sbom-security-report.json
          retention-days: 90
