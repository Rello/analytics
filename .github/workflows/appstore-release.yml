name: Build and publish appstore release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      prerelease:
        description: Publish as a nightly release
        default: false
        type: boolean
      reuse_asset:
        description: Submit the existing signed release asset without rebuilding
        default: false
        type: boolean

env:
  APP_NAME: analytics

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Set up PHP
        if: ${{ !inputs.reuse_asset }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,zip
          coverage: none

      - name: Set up local Nextcloud server
        if: ${{ !inputs.reuse_asset }}
        uses: SMillerDev/nextcloud-actions/setup-nextcloud@ae95709955d06dea39756101e07ec5b6134f14d7
        with:
          version: stable29
          database-type: sqlite
          cron: false

      - name: Install app into local Nextcloud server
        if: ${{ !inputs.reuse_asset }}
        uses: SMillerDev/nextcloud-actions/setup-nextcloud-app@ae95709955d06dea39756101e07ec5b6134f14d7
        with:
          app: ${{ env.APP_NAME }}
          check-code: false

      - name: Create signing key and certificate files from secrets
        if: ${{ !inputs.reuse_asset }}
        run: |
          cert_dir="$HOME/.nextcloud/certificates"
          mkdir -p "$cert_dir"
          printf '%s\n' "$APP_PRIVATE_KEY" > "$cert_dir/${APP_NAME}.key"
          printf '%s\n' "$APP_PUBLIC_CRT" > "$cert_dir/${APP_NAME}.crt"
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}

      - name: Build signed app archive (without Makefile)
        if: ${{ !inputs.reuse_asset }}
        run: |
          cert_dir="$HOME/.nextcloud/certificates"
          app_dir="../server/apps/${APP_NAME}"
          signed_dir="$app_dir/build/artifacts/appstore/sign/${APP_NAME}"

          mkdir -p "$signed_dir"
          rsync -a --delete \
            --exclude '.DS_Store' \
            --exclude '.eslintrc.js' \
            --exclude '.gitignore' \
            --exclude '.l10nignore' \
            --exclude '.phpunit.result.cache' \
            --exclude '.git' \
            --exclude '.tx' \
            --exclude '.tx' \
            --exclude 'phpunit.xml' \
            --exclude '.github' \
            --exclude 'sample_data' \
            --exclude 'screenshots' \
            --exclude 'tests' \
            --exclude 'tests/ui-artifacts' \
            ./ "$signed_dir/"

          cd "$app_dir"
          php ../../occ integrity:sign-app \
            --privateKey="$cert_dir/${APP_NAME}.key" \
            --certificate="$cert_dir/${APP_NAME}.crt" \
            --path="$signed_dir"

          tar -C "build/artifacts/appstore/sign" \
            -czf "build/artifacts/appstore/${APP_NAME}.tar.gz" \
            "${APP_NAME}"

      - name: Upload app tarball to release
        if: ${{ !inputs.reuse_asset }}
        id: attach_to_release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ../server/apps/${{ env.APP_NAME }}/build/artifacts/appstore/${{ env.APP_NAME }}.tar.gz
          asset_name: ${{ env.APP_NAME }}.tar.gz
          tag: ${{ inputs.tag || github.event.release.tag_name }}
          overwrite: true

      - name: Resolve existing release asset
        if: ${{ inputs.reuse_asset }}
        id: existing_asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          url=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "analytics.tar.gz") | .url')
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Upload app to Nextcloud appstore
        uses: R0Wi/nextcloud-appstore-push-action@v1.0.5
        with:
          app_name: ${{ env.APP_NAME }}
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          download_url: ${{ steps.existing_asset.outputs.url || steps.attach_to_release.outputs.browser_download_url }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          nightly: ${{ inputs.prerelease || github.event.release.prerelease || false }}

      - name: Remove local key material
        if: always()
        run: rm -f "$HOME/.nextcloud/certificates/${APP_NAME}.key" "$HOME/.nextcloud/certificates/${APP_NAME}.crt"
