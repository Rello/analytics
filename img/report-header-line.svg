<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 112">
    <!-- Preserve the original app-color.svg geometry; inset its outline to reduce weight. -->
    <defs>
        <path id="analytics-mark" d="M23.443 2.002C23.406 2.018 18.467 7.122 18.331 7.235 17.913 7.236 19.419 7.778 19.493 7.842 19.58 7.906 15.669 17.193 15.611 17.08 15.312 16.5 10.96 4.374 10.919 4.317 9.386 2.187 8.966 2.389 7.419 4.339 7.397 4.367 1.848 16.375 1.34 17.514-0.087 20.722 0.417 21.947 1.356 22.114 2.341 22.289 2.386 21.46 4.572 16.906L10.459 16.883C10.654 16.863 10.276 14.904 9.246 14.552 8.513 14.117 6.004 14.315 5.651 14.246 5.616 14.24 8.973 6.828 8.973 6.828l3.168 8.74c1.357 3.591 2.158 5.859 2.282 6.036 0.571 0.818 1.9 0.641 2.242-0.115 0.439-0.971 5.278-12.699 5.361-12.654 0.138 0.075 1.298 0.57 1.298 0.57s0.156-7.403 0.119-7.403Z"/>
        <mask id="thinner-mark" maskUnits="userSpaceOnUse" x="-1" y="-1" width="26" height="26" style="mask-type: luminance">
            <use href="#analytics-mark" fill="white" stroke="black" stroke-width="1.1" stroke-linejoin="round"/>
        </mask>
        <clipPath id="peak">
            <path d="M6 1H12V8H6Z"/>
        </clipPath>
        <clipPath id="outside-peak">
            <path d="M-1-1H25V25H-1Z M6 1V8H12V1Z" clip-rule="evenodd"/>
        </clipPath>
        <filter id="smooth-inset" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
            <feGaussianBlur stdDeviation="0.28"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="4" intercept="-1.5"/>
            </feComponentTransfer>
        </filter>
    </defs>
    <path d="M0 111H43" fill="none" stroke="#12426E" stroke-width="2"/>
    <path d="M43 111L48 100" fill="none" stroke="#12426E" stroke-width="5.5"/>
    <g transform="translate(40 8) scale(4.5)">
        <use href="#analytics-mark" fill="#12426E" mask="url(#thinner-mark)" clip-path="url(#outside-peak)"/>
        <g clip-path="url(#peak)">
            <g filter="url(#smooth-inset)">
                <use href="#analytics-mark" fill="#12426E" mask="url(#thinner-mark)"/>
            </g>
        </g>
    </g>
</svg>
